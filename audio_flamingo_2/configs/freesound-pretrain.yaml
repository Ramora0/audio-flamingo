train_config:
  expdir: /fs/scratch/PAS2836/lees_stuff/runs
  run_name: freesound-pretrain-0.5B
  delete_previous_checkpoint: true
  batch_size: 4                  # tuned for A100 40GB
  gradient_accumulation_steps: 1
  seed: 42
  learning_rate: 0.0001
  lr_scheduler: constant
  loss_multiplier: 1.0
  warmup_steps: 500              # bumped from 50 (smoke) for ~39K-step pretrain
  weight_decay: 0.1
  precision: amp_bf16
  gradient_checkpointing: true   # 40GB safety; trades compute for memory headroom
  num_epochs: 1                  # 1 pass through ~156K (max_duration=30 filter) / bs=4 ≈ 39K steps
  offline: false
  freeze_lm_embeddings: false
  logging_steps: 50
  dist_backend: nccl
  dist_url: env://
  no_set_device_rank: false
  fsdp: false
  fsdp_use_orig_params: false
  fsdp_sharding_strategy: full
  horovod: false

data_config:
  dataset_blending_global_weight: 1.0

  dataset_blending_config:
    WavCaps-FreeSound-AudioCaptioning/train:
      weight: 1.0

  dataset_file_root: /fs/scratch/PAS2836/lees_stuff/wavcaps/manifests
  data_root: /fs/scratch/PAS2836/lees_stuff/wavcaps    # parent of shards/ — manifest's zip_archive is resolved relative to this
  dataset_blending_output: dataset_blending.json
  max_tokens: 512
  num_workers: 4

  valid_dataset_config:
    WavCaps-FreeSound-AudioCaptioning/train: true

clap_config:
  method: afclap-large
  audio_embed_dim: 2048
  checkpoint: /fs/scratch/PAS2836/lees_stuff/checkpoints/af2/clap_ckpt/epoch_16.pt

  window_length: 10.0
  window_overlap: 0.0
  max_num_window: 3              # 30s cap, matches AF2 pretrain

wandb_config:
  enabled: true
  project: audio-flamingo-2
  entity: null
  group: null
  tags: [pretrain, freesound, qwen-0.5b]
  mode: online

model_config:
  cache_dir: /fs/scratch/PAS2836/lees_stuff/hf_cache/hub

  lang_encoder_path: Qwen/Qwen2.5-0.5B
  tokenizer_path: Qwen/Qwen2.5-0.5B
  cross_attn_every_n_layers: 1
  audio_transformer_kwargs: {
    n_head: 8,
    n_layers: 3,
    d_inner: 2048,
    max_num_media: 128,
    max_window_per_audio: 1,
    common_encoder_embed_dim: 1024
  }
